[package]
name = "drift-age-island"
version = "0.1.0"
description = "《漂流纪元：孤岛》"
authors = ["Codex"]
edition = "2021"

[lib]
name = "drift_age_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
